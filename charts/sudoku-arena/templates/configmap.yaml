apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sudoku-arena.fullname" . }}-config
  labels:
    {{- include "sudoku-arena.labels" . | nindent 4 }}
data:
  MQTT_BROKER: "{{ include "sudoku-arena.fullname" . }}-mosquitto"
  MQTT_PORT: "{{ .Values.mosquitto.service.tcpPort }}"
  REDIS_HOST: "{{ include "sudoku-arena.fullname" . }}-redis"
  REDIS_PORT: "{{ .Values.redis.service.port }}"
  ENVIRONMENT: "{{ .Values.global.environment }}"
