apiVersion: v1
kind: Service
metadata:
  name: {{ include "sudoku-arena.fullname" . }}-frontend
  labels:
    {{- include "sudoku-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sudoku-arena.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
