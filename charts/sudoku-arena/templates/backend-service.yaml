apiVersion: v1
kind: Service
metadata:
  name: {{ include "sudoku-arena.fullname" . }}-backend
  labels:
    {{- include "sudoku-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sudoku-arena.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "sudoku-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sudoku-arena.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

