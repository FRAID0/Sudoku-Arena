global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sudoku-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          app: 'sudoku-arena'
          env: 'local'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
