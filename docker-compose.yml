services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sudoku_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - sudoku_network

  redis:
    image: redis:7-alpine
    container_name: sudoku_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sudoku_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudoku_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mosquitto
      - redis
    networks:
      - sudoku_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudoku_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - sudoku_network

networks:
  sudoku_network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  redis_data:
