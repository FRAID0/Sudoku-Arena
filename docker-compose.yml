services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sudoku_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - sudoku_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudoku_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    networks:
      - sudoku_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudoku_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - sudoku_network

networks:
  sudoku_network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
