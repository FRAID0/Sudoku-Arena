apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudoku-frontend-deployment
  labels:
    app: sudoku-frontend
spec:
  # 2 répliques de l'interface Nginx (Haute Disponibilité)
  replicas: 2
  selector:
    matchLabels:
      app: sudoku-frontend
  template:
    metadata:
      labels:
        app: sudoku-frontend
    spec:
      containers:
        - name: frontend
          image: sudoku-arena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sudoku-frontend-service
  labels:
    app: sudoku-frontend
spec:
  # LoadBalancer : Docker Desktop ouvre automatiquement l'accès sur localhost:8080
  type: LoadBalancer
  selector:
    app: sudoku-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 80
