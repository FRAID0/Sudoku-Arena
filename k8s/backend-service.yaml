apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: sudoku-backend
spec:
  # ClusterIP = Adresse IP interne fixe et sécurisée au sein du cluster Kubernetes
  type: ClusterIP
  selector:
    app: sudoku-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sudoku-backend-service
  labels:
    app: sudoku-backend
spec:
  type: ClusterIP
  selector:
    app: sudoku-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
