name: Release & Security — GHCR & Trivy

# Déclenché lors d'un push sur main ou lors d'un tag de version sémantique v*
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -------------------------------------------------------------
  # Validation préalable : tous les tests doivent passer
  # -------------------------------------------------------------
  test-and-lint:
    name: 🧪 Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🐍 Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: 🚀 Lancer les tests unitaires
        run: |
          cd backend
          pytest -v

  # -------------------------------------------------------------
  # Build, Scan de Sécurité Trivy & Publication sur GHCR
  # -------------------------------------------------------------
  publish-images:
    name: 📦 Build, Scan & Publish to GHCR
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: ⚙️ Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Préparer les tags Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: 🏷️ Préparer les tags Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sudoku-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      # ---------------------------------------------------------
      # 1. Build & Scan Trivy : BACKEND
      # ---------------------------------------------------------
      - name: 🔨 Build local Backend pour scan de sécurité
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: sudoku-backend:local-scan

      - name: 🛡️ Scan de Sécurité Trivy (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sudoku-backend:local-scan
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🚀 Publier l'image Backend sur GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # ---------------------------------------------------------
      # 2. Build & Scan Trivy : FRONTEND
      # ---------------------------------------------------------
      - name: 🔨 Build local Frontend pour scan de sécurité
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: sudoku-frontend:local-scan

      - name: 🛡️ Scan de Sécurité Trivy (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sudoku-frontend:local-scan
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🚀 Publier l'image Frontend sur GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
